[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "mjlab"
version = "1.6.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  {name = "The MjLab Developers"},
]
keywords = ["mujoco", "mujoco-warp", "simulation", "reinforcement-learning", "robotics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Environment :: GPU :: NVIDIA CUDA",
  "Topic :: Scientific/Engineering",
  "Natural Language :: English",
]
description = "AMP locomotion demo for the LingLong humanoid, built on a minimal mjlab core (MuJoCo-Warp)."
requires-python = ">=3.10,<3.14"
dependencies = [
  "prettytable",
  "tqdm",
  "tyro>=1.0.1",
  "torch>=2.7.0",
  "torchrunx>=0.3.4",
  "warp-lang>=1.14.0",
  "mujoco-warp~=3.11.0",
  "mujoco~=3.11.0",
  "trimesh>=4.8.3",
  "scipy>=1.15",
  "viser>=1.0.27",
  "mjviser>=0.0.14",
  "mediapy>=1.2.7",
  "numpy",
  "imageio-ffmpeg",
  "tensordict",
  "rsl-rl-lib==5.5.0",
  "tensorboard>=2.20.0",
  "setuptools>=80,<81",
  "onnxscript>=0.5.4",
  "wandb>=0.22.3,<0.29",
]

[project.scripts]
train = "mjlab.scripts.train:main"
play = "mjlab.scripts.play:main"
list-envs = "mjlab.scripts.list_envs:main"
viz-nan = "mjlab.scripts.nan_viz:main"

[dependency-groups]
dev = [
  "ipdb>=0.13.13",
  "pre-commit>=4.3.0",
  "pyright>=1.1.408",
  "onnxruntime>=1.19.0; python_version >= '3.11'",
  "pytest>=v9.0.3",
  "ruff>=0.16.1",
  "ty>=v0.0.14",
]

[project.optional-dependencies]
cu128 = ["torch>=2.7.0"]
cpu = ["torch>=2.7.0"]

[tool.uv]
conflicts = [
  [{extra = "cu128"}, {extra = "cpu"}],
]
constraint-dependencies = [
  "GitPython>=3.1.57",
  "lxml>=6.1.0",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 2
exclude = [
  "src/mjlab/utils/lab_api",
]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "--strict-markers"
filterwarnings = [
  # MuJoCo Warp warns that MULTICCD (enabled by default) generates at most one
  # contact for CCD pairs it lacks multicontact support for (e.g. cylinder-box,
  # hfield-capsule). Test fixtures aren't validating contact fidelity for these
  # pairs, so silence the expected noise.
  "ignore:MULTICCD is enabled, but the scene contains CCD pairs:UserWarning",
]
