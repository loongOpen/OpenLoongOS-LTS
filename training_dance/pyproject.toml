[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mjlab"
version = "1.6.0+linglong14.sim1"
description = "Standalone Linglong 1.4 dance training and simulation with MjLab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-LINGLONG-SOURCE", "NOTICE"]
dependencies = [
  "prettytable", "tqdm", "tyro>=1.0.1", "torch>=2.7.0",
  "warp-lang>=1.14.0", "mujoco-warp~=3.11.0", "mujoco~=3.11.0",
  "trimesh>=4.8.3", "scipy>=1.15", "viser>=1.0.27", "mjviser>=0.0.14",
  "mediapy>=1.2.7", "numpy", "imageio-ffmpeg", "tensordict",
  "rsl-rl-lib==5.5.0", "tensorboard>=2.20.0", "PyYAML", "packaging",
  "wandb>=0.22.3,<0.29", "onnxscript>=0.5.4"
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]

[project.scripts]
train = "mjlab.scripts.train:main"
play = "mjlab.scripts.play:main"
list-envs = "mjlab.scripts.list_envs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mjlab = ["**/*.xml", "**/*.urdf", "**/*.stl", "**/*.STL", "**/*.npz", "**/*.png", "**/*.jpg", "**/*.obj", "**/*.mtl", "py.typed"]

[tool.ruff]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:MULTICCD is enabled:UserWarning"]
