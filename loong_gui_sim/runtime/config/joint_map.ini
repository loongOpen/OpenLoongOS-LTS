[ankle]
; 左腿为参照，右腿在库内部按 y 轴镜像自动生成
; 踝关节中心为原点，脚底放平为零位
; 脚踝向下为 pitch 正方向，电机曲柄向上为电机正方向
; 若未显式填写 pitchAxis/rollAxis/pitchOuter/pitchLower... 等，
; 库会默认参考 LingLong2.0_20260616/LingLong2.urdf
ankPr0Left=-0.066,0.03575,0
ballPosLeft=-0.066,0.046,0.186
ballPosRight=-0.066,-0.046,0.297
motPosLeft=0,0.046,0.186
motPosRight=0,-0.046,0.297

; 十字轴定义。默认就是 Lite/Linglong 这种 pitch 外、roll 内
pitchAxis=0,1,0
rollAxis=1,0,0
rotateDirection=0,1,0
pitchOuter=1

; 可选：如果右侧跟腱球铰不是严格镜像，可以单独给
; ankPr0Right=-0.066,-0.03575,0

; 可选：按“左腿两个电机 / 右腿两个电机”的顺序配置零位
; leftLegMotorBias=0,0
; rightLegMotorBias=0,0

[limit]
; 不是机械限位，而是求解侧的安全工作域
motLim=1.5
; ankLim 现在只作为“URDF 不可用时”的对称兜底限位
ankLim=1.5
motDif=1.3

; 可选：如果 pitch/roll 范围不对称，可以显式覆盖
; pitchLower=-0.8
; pitchUpper=0.6
; rollLower=-0.5
; rollUpper=0.5

; SIM: explicit bounds from LingLong2.0_20260616/LingLong_fullbody30.xml.
; Keep identical in a relocated checkout without upstream URDF discovery.
pitchLower=-0.802851456
pitchUpper=0.602138592
rollLower=-0.523598776
rollUpper=0.523598776
