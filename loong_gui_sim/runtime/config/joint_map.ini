[ankle]
pitchCenter=0,0,0
rollCenter=0,0,0
; 左腿为参照，右腿在库内部按 y 轴镜像自动生成
; 踝关节中心为原点，脚底放平为零位
; 脚踝向下为 pitch 正方向，电机曲柄向上为电机正方向
; 若未显式填写 pitchAxis/rollAxis/pitchOuter/pitchLower... 等，
; 库会默认参考 models/linglong2_20260616/LingLong2.urdf
ankPr0Left=-0.066,0.03575,0
ballPosLeft=-0.066,0.046,0.186
ballPosRight=-0.066,-0.046,0.297
motPosLeft=0,0.046,0.186
motPosRight=0,-0.046,0.297

; 十字轴定义。默认就是 Lite/Linglong 这种 pitch 外、roll 内
pitchAxis=0,1,0
rollAxis=1,0,0
rotateDirection=0,1,0
pitchOuter=1

; External driver pair -> internal link index. 0=short rod, 1=long rod.
; Confirmed driver indices: 23=left long, 24=left short; 29=right long, 30=right short.
; Both external pairs are [long, short]; do not swap again in the caller.
leftLegMotorOrder=1,0
rightLegMotorOrder=1,0

; Sensor velocity only: damp if abs(det(J)) < threshold OR cond(J) > threshold.
velMapDetThreshold=0.02
velMapConditionThreshold=50
velMapDamping=0.03
; Per-component joint feedback velocity limit (rad/s); 0 disables the clamp.
velMapMax=12

; 可选：如果右侧跟腱球铰不是严格镜像，可以单独给
; ankPr0Right=-0.066,-0.03575,0

; 可选：按“左腿两个电机 / 右腿两个电机”的顺序配置零位
; leftLegMotorBias=0,0
; rightLegMotorBias=0,0

[limit]
pitchLower=-0.8029
pitchUpper=0.6109
rollLower=-0.5236
rollUpper=0.5236
; 不是机械限位，而是求解侧的安全工作域
motLim=1.5
; ankLim 现在只作为“URDF 不可用时”的对称兜底限位
ankLim=1.5
motDif=1.3

; Measurement-only margin (rad), not extra motion range. 0 restores strict bounds.
feedbackLimitMargin=0.01
; Reject ill-conditioned commands; do not use a damped torque approximation.
commandConditionMax=50
; Internal [short rod, long rod] order. 0 = unspecified, NOT a safe hardware limit.
; Fill using the actual output-shaft datasheet and test results before deployment.
motorVelocityMax=0,0
motorTorqueMax=0,0
motorKpMax=0,0
motorKdMax=0,0

; 可选：如果 pitch/roll 范围不对称，可以显式覆盖
; pitchLower=-0.8
; pitchUpper=0.6
; rollLower=-0.5
; rollUpper=0.5

[pdmode3]
; Applied only by linglong_ankle_pdmode3_map/full_map, not update/dwdate.
enableCouplingTorque=1
enableAnkleCouplingTorque=1

; Optional independent calibration, in the SAME robot-aligned ankle frame (m/rad).
; Base right geometry is mirrored from the uncalibrated base left geometry.
; Left-only calibration does not propagate to the right ankle.
[left_ankle]
; motor0Origin=0,0.046,0.186
; motor0Ball=-0.066,0.046,0.186
; motor0Foot=-0.066,0.03575,0
; motor0Axis=0,1,0
; motor0RodLength=0.1862822
; motor0Bias=0
; Replace motor0 with motor1 for the long rod; angles reference the calibrated zero.

[right_ankle]
; motor0Origin=0,-0.046,0.186
; motor0Ball=-0.066,-0.046,0.186
; motor0Foot=-0.066,-0.03575,0
; motor0Axis=0,1,0
; motor0RodLength=0.1862822
; motor0Bias=0
; Both leg sections also accept pitchCenter/rollCenter/pitchAxis/rollAxis,
; pitchLower/pitchUpper/rollLower/rollUpper and the four motor capability arrays.
